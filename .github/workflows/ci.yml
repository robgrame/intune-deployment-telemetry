name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build, test, and validate
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\IntuneDeploymentTelemetry.slnx

      - name: Build
        run: dotnet build .\IntuneDeploymentTelemetry.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test .\IntuneDeploymentTelemetry.slnx --configuration Release --no-build

      - name: Verify formatting
        run: dotnet format .\IntuneDeploymentTelemetry.slnx --verify-no-changes --no-restore

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem .\scripts -Filter *.ps1 -Recurse) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

      - name: Test direct-ingestion payload
        shell: pwsh
        run: .\tests\powershell\Test-DirectIngestionPayload.ps1

      - name: Test POC script template
        shell: powershell
        run: .\tests\powershell\Test-PocScriptTemplate.ps1

      - name: Verify secret placeholders
        shell: pwsh
        run: .\tests\powershell\Test-TrackedScriptPlaceholders.ps1

      - name: Test deployment-evidence workbook
        shell: pwsh
        run: .\tests\powershell\Test-WorkbookTemplate.ps1

      - name: Build Bicep
        shell: pwsh
        run: |
          az bicep install
          az bicep build --file .\infra\main.bicep --stdout | Out-Null
          az bicep build --file .\infra\poc.bicep --stdout | Out-Null

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Review dependencies
        uses: actions/dependency-review-action@v4
